<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHME Token Claim</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle, #1e293b, #0f172a); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; width: 380px; }
        h1 { color: #38bdf8; font-size: 28px; margin-bottom: 5px; }
        p { color: #94a3b8; margin-bottom: 25px; font-size: 14px; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 14px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: #7dd3fc; transform: scale(1.02); }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 13px; color: #fbbf24; line-height: 1.5; }
    </style>
</head>
<body>

<div class="card">
    <h1>CHME Claim</h1>
    <p>Get 888 CHME for each NFT you hold</p>
    
    <button id="connectBtn" class="btn">Connect Wallet</button>
    <button id="claimBtn" class="btn" style="display: none;">Claim CHME Now</button>
    
    <div id="status">Connect your wallet on Base Network</div>
</div>

<script>
    // ১. আপনার Claim Contract Address এখানে বসান
    const claimContractAddress = "0xb08E597759e22F3cD99CB04d246e4AF4559c3a1B"; 
    
    // ২. স্মার্ট কন্ট্রাক্টের ABI (Remix থেকে কপি করা)
    const abi = [[
	{
		"inputs": [],
		"name": "claim",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "owner",
				"type": "address"
			}
		],
		"name": "OwnableInvalidOwner",
		"type": "error"
	},
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "account",
				"type": "address"
			}
		],
		"name": "OwnableUnauthorizedAccount",
		"type": "error"
	},
	{
		"anonymous": false,
		"inputs": [
			{
				"indexed": true,
				"internalType": "address",
				"name": "previousOwner",
				"type": "address"
			},
			{
				"indexed": true,
				"internalType": "address",
				"name": "newOwner",
				"type": "address"
			}
		],
		"name": "OwnershipTransferred",
		"type": "event"
	},
	{
		"inputs": [],
		"name": "renounceOwnership",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "newOwner",
				"type": "address"
			}
		],
		"name": "transferOwnership",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "withdrawRemainingTokens",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "chmeToken",
		"outputs": [
			{
				"internalType": "contract IERC20",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "chromaNFT",
		"outputs": [
			{
				"internalType": "contract IERC721",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"name": "hasClaimed",
		"outputs": [
			{
				"internalType": "bool",
				"name": "",
				"type": "bool"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "owner",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "TOKENS_PER_NFT",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
]
        "function claim() external",
        "function hasClaimed(address) view returns (bool)",
        "function chromaNFT() view returns (address)"
    ];

    const connectBtn = document.getElementById('connectBtn');
    const claimBtn = document.getElementById('claimBtn');
    const status = document.getElementById('status');

    let provider, signer, contract;

    async function init() {
        if (!window.ethereum) {
            status.innerHTML = "MetaMask not found. Please install it.";
            return;
        }

        // ওয়ালেট কানেক্ট হ্যান্ডলার
        connectBtn.addEventListener('click', async () => {
            try {
                // ১. অ্যাকাউন্ট রিকোয়েস্ট
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                
                // ২. নেটওয়ার্ক চেক (Base Mainnet Chain ID: 8453 বা 0x2105)
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId !== '0x2105') {
                    status.innerHTML = "Switching to Base Network...";
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x2105' }],
                        });
                    } catch (switchError) {
                        status.innerHTML = "Please add Base Network to MetaMask manually.";
                        return;
                    }
                }

                // ৩. Ethers Provider সেটআপ
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                const userAddress = await signer.getAddress();
                
                contract = new ethers.Contract(claimContractAddress, abi, signer);

                // ৪. ইউজার কি ইতিমধ্যে ক্লেম করেছেন?
                const alreadyClaimed = await contract.hasClaimed(userAddress);
                
                status.innerHTML = "Connected: " + userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
                connectBtn.style.display = 'none';
                claimBtn.style.display = 'block';

                if (alreadyClaimed) {
                    claimBtn.disabled = true;
                    claimBtn.innerText = "Already Claimed";
                }

            } catch (error) {
                console.error(error);
                status.innerHTML = "Connection failed: " + error.message;
            }
        });

        // ক্লেম বাটন হ্যান্ডলার
        claimBtn.addEventListener('click', async () => {
            try {
                status.innerHTML = "Confirm transaction in MetaMask...";
                const tx = await contract.claim();
                
                status.innerHTML = "Processing... Transaction Hash: <br><a href='https://basescan.org/tx/" + tx.hash + "' target='_blank' style='color:#38bdf8'>View on BaseScan</a>";
                
                await tx.wait();
                
                status.innerHTML = "🎉 Success! Tokens sent to your wallet.";
                claimBtn.disabled = true;
                claimBtn.innerText = "Claimed";
            } catch (error) {
                console.error(error);
                status.innerHTML = "Error: " + (error.reason || "Transaction failed");
            }
        });
    }

    window.onload = init;
</script>

</body>
</html>
