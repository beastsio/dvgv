<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHME Airdrop Claim</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e11; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e2126; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #38bdf8; width: 350px; }
        .btn { background: #38bdf8; color: #000; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="box">
    <h2>CHME Claim</h2>
    <p>Get 888 CHME per NFT</p>
    <button id="connectBtn" class="btn">Connect Wallet</button>
    <button id="claimBtn" class="btn" style="display:none;">Claim Now</button>
    <div id="status">Status: Wallet not connected</div>
</div>

<script>
    // ১. আপনার Claim Contract Address এখানে দিন
    const contractAddress = "YOUR_CLAIM_CONTRACT_ADDRESS_HERE";
    
    // ২. ABI (শুধুমাত্র প্রয়োজনীয় ফাংশনগুলো)
    const abi = [
        "function claim() external",
        "function hasClaimed(address) view returns (bool)"
    ];

    let provider, signer, contract;

    const connectBtn = document.getElementById('connectBtn');
    const claimBtn = document.getElementById('claimBtn');
    const statusDiv = document.getElementById('status');

    async function connect() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                statusDiv.innerText = "Status: Connecting...";
                
                // মেটামাস্ক পপআপ আসার জন্য সরাসরি রিকোয়েস্ট
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const walletAddress = accounts[0];

                // Base Network চেক ও সুইচ (Chain ID: 8453)
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x2105' }], 
                    });
                } catch (e) {
                    if (e.code === 4902) {
                        statusDiv.innerText = "Please add Base Network to MetaMask!";
                        return;
                    }
                }

                // Ethers setup
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                contract = new ethers.Contract(contractAddress, abi, signer);

                // চেক করা ইউজার আগে ক্লেম করেছে কি না
                const alreadyClaimed = await contract.hasClaimed(walletAddress);

                statusDiv.innerText = "Connected: " + walletAddress.substring(0,6) + "...";
                connectBtn.style.display = 'none';
                claimBtn.style.display = 'block';

                if (alreadyClaimed) {
                    claimBtn.disabled = true;
                    claimBtn.innerText = "Already Claimed";
                }

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Error: User rejected or failed.";
            }
        } else {
            alert("MetaMask is not installed!");
            statusDiv.innerText = "Status: Install MetaMask";
        }
    }

    async function claim() {
        try {
            statusDiv.innerText = "Status: Please confirm in MetaMask...";
            const tx = await contract.claim();
            statusDiv.innerText = "Status: Pending Transaction...";
            await tx.wait();
            statusDiv.innerText = "Status: Successfully Claimed!";
            claimBtn.disabled = true;
        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Error: Transaction failed.";
        }
    }

    connectBtn.onclick = connect;
    claimBtn.onclick = claim;

</script>
</body>
</html>
